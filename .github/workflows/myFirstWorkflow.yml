name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on: 
  push: 

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step-2 checkout
        uses: actions/checkout@v7.0.1
      - name: step-3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt
          ls -ltr
          hostname
      - name: Upload Single file
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt
      - name: Upload from directory
        uses: actions/upload-artifact@v7.0.1
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v7.0.1
        with:
          name: multiple_paths
          path: |
            ./myartifats.txt
            artifacts/
      - name: Upload from multiple paths with exclusions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: multiple_paths_with_exclusions
          path: |
            ./myartifats.txt
            artifacts/
            !**/hostname.txt
          
      
  
          
 
          
