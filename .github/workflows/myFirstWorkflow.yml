name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on: 
  push:
    branches: 
      - dev
      - 'feature-*'
      - main
  pull_request: 
    branches:
      - main

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step-2 checkout
        uses: actions/checkout@v7.0.1
      - name: step-3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt
          ls -ltr
          hostname
      - name: Upload Single file
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checking curent directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: single_file
      - name: checking curent directory post download
        run: |
          pwd
          ls -ltr
      - name: Step for PR Demos
        run: exit 1
          
  

          
