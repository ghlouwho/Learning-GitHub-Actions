name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on: 
  push:
    branches: 
      - main
  pull_request: 
    branches:
      - main
env:
  ENV_TYPE: DEV
  APP_USER: thinknyx
  APP_PORT: 80
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step-2 checkout
        uses: actions/checkout@v7.0.1
      - name: step-3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt
          ls -ltr
          hostname
      - name: Upload Single file
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Download single file artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: single_file
      - name: Referring Environment Variables
        run: |
          echo "[INFO] running deployment for $ENV_TYPE wih user $APP_USER."
          echo "[INFO] Once deployed it is accessible on port $APP_PORT."
      - name: Referrencing repository secrets
        run: |
          echo "[INFO] Application password is ${{ secrets.APP_PASSWORD }}"
          echo 
  job3:
    name: JOB3
    runs-on: ubuntu-latest
    steps:    
      - name: Referring context or in-built variable
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}."
          echo "[INFO] New changes are added by ${{ github.actor }} in ${{ github.ref_name }} branch."
          echo "[INFO] Current step is running on ${{ runner.os }}."
          echo "[INFO] Current JOB ID is ${{ job.check_run_id }}."
  staging:
    name: STAGE DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring Environment variables
        run: echo "[INFO] Running deployment on ${{ vars.HOST }} using ${{ vars.USER }}."
      - name: Referring Environment Secrets
        run: echo "{INFO] Password for ${{ vars.USER }} is ${{ secrets.PASSWORD }}."
    environment:
      name: STAGING
    if: github.ref == 'refs/heads/dev'
  production:
    name: PRODUCTION DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring Environment variables
        run: echo "[INFO] Running deployment on ${{ vars.HOST }} using ${{ vars.USER }}."
      - name: Referring Environment Secrets
        run: echo "{INFO] Password for ${{ vars.USER }} is ${{ secrets.PASSWORD }}."
    environment:
      name: PRODUCTION   
    if: github.ref == 'refs/heads/main'
    
  

          
